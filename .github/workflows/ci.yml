name: CI

on:
  push:
    branches: [main]
    # 只在可能影响自检结果的文件变更时触发，减少无谓运行
    paths:
      - "skills/**"
      - "tests/**"
      - "README.md"
      - "package.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新一次运行，旧的自动取消（避免堆积）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # 显式 UTF-8：技能本体与测试含大量中文，避免非 UTF-8 locale 下报错
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      # 注意：不要加 `cache: pip`。
      # setup-python 的 pip 缓存需要一个依赖文件（requirements.txt / pyproject.toml）
      # 来计算缓存键；本项目是 Agent Skill，没有这些文件，会导致该步骤直接失败。
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run structure self-check
        run: python tests/test_structure.py

      # mcp 是可选依赖，装上才能真实跑 MCP 端到端
      # （测试内部也会检测：没装则优雅跳过而非失败）
      - name: Install optional MCP dependency
        run: python -m pip install "mcp>=2.0.0"

      - name: Run MCP server smoke test
        run: python tests/test_mcp_e2e.py

      - name: Install optional python-pptx
        run: python -m pip install python-pptx

      - name: Run master/retemplate self-check
        run: python tests/test_master.py

      - name: Verify README links
        run: python scripts/check_readme_links.py

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown files exist and are non-empty
        run: |
          set -e
          fail=0
          for f in README.md skills/duduppt/SKILL.md CHANGELOG.md COMMUNITY.md LICENSE \
                   skills/duduppt/docs/QUICKSTART.md skills/duduppt/docs/SUBMISSION.md \
                   skills/duduppt/references/design-principles.md skills/duduppt/references/palettes.md \
                   skills/duduppt/references/typography-scale.md skills/duduppt/references/chart-type-anatomy.md \
                   skills/duduppt/references/merge-and-qa.md skills/duduppt/references/blind-read-prompt.md \
                   skills/duduppt/references/prompt-templates.md skills/duduppt/references/multi-model-guide.md; do
            if [ ! -s "$f" ]; then
              echo "MISSING or EMPTY: $f"
              fail=1
            else
              echo "OK $f ($(wc -c < "$f") bytes)"
            fi
          done
          exit $fail

  verify-references:
    name: Verify SKILL.md references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: All referenced paths must exist
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          # SKILL.md 在 skills/duduppt/ 下；其内部引用的相对路径也以该目录为基准
          skill_dir = Path("skills/duduppt")
          text = (skill_dir / "SKILL.md").read_text(encoding="utf-8")
          refs = set(re.findall(r"`((?:scripts|references|assets|examples|docs)/[^`\s]+)`", text))
          missing = [r for r in sorted(refs) if not (skill_dir / r).exists()]
          print(f"checked {len(refs)} references")
          if missing:
              print("MISSING:", missing)
              sys.exit(1)
          print("all references exist")
          PY

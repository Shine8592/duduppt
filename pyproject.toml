[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duduppt"
version = "3.2.0"
description = "Consulting-grade PPTX generation skill for AI agents: evidence-chain QA (blind-read review, claim tracing, audit report), native editable PPTX, native charts, edit existing decks, 16 style master templates, MCP server with 13 tools. First-class Chinese support."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shine8592" }]
keywords = [
    "pptx", "ppt", "powerpoint", "presentation", "skill", "agent-skill",
    "claude", "mcp", "model-context-protocol", "ai-agent", "llm",
    "consulting", "qa", "evidence-chain", "blind-read", "claim-tracing",
    "chinese", "cjk", "deck", "slide", "office", "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 核心依赖为零：Skill 本体是 Markdown + 脚本，装完即用。
# 各脚本按需声明额外依赖（见 optional-dependencies），不强制安装。
dependencies = []

[project.optional-dependencies]
# 生成引擎（pptxgenjs 走 Node；此处为 Node 侧的依赖说明）
# 编辑 / 母版 / 原生图表 等 Python 脚本需要 python-pptx
edit = ["python-pptx>=1.0.0"]
py = ["python-pptx>=1.0.0", "Pillow>=10.0.0"]
full = ["python-pptx>=1.0.0", "Pillow>=10.0.0", "mcp>=2.0.0"]

[project.urls]
Homepage = "https://github.com/Shine8592/duduppt"
Repository = "https://github.com/Shine8592/duduppt"
Issues = "https://github.com/Shine8592/duduppt/issues"
Changelog = "https://github.com/Shine8592/duduppt/blob/main/CHANGELOG.md"
"Competitive Analysis" = "https://github.com/Shine8592/duduppt/blob/main/competitive-analysis-v3.md"
Documentation = "https://github.com/Shine8592/duduppt/blob/main/skills/duduppt/SKILL.md"

[project.scripts]
duduppt = "duduppt.cli:main"

[tool.setuptools]
# 把 skills/duduppt 整体映射为包内 duduppt/skill/ 目录
include-package-data = true

[tool.setuptools.packages.find]
include = ["duduppt*"]

[tool.setuptools.package-data]
duduppt = [
    "skill/**/*",
]
